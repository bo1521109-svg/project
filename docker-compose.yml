services:
  db:
    image: postgres:15
    container_name: postgres_db_main
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_main:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: heiheioi/myproject-web:latest
    container_name: fastapi_app_main
    ports:
      - "0.0.0.0:8001:8000"
    volumes:
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      db:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: heiheioi/myproject-frontend:latest
    container_name: nginx_frontend_main
    ports:
      - "0.0.0.0:8080:80"
    depends_on:
      - web

volumes:
  postgres_data_main:
